<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviveShop & Retendo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>ReviveShop & Retendo</h1>
            <p class="subtitle">Reviving Nintendo Network Services</p>
        </div>
    </header>

    <main class="container">
        <section class="cards">
            <div class="card">
                <h2>ReviveShop</h2>
                <p class="status status-active">Online</p>
                <p>eShop revival services for 3DS and Wii U.</p>
                <a href="https://github.com/thecatlinkids2-ctrl/ReviveShop" class="btn">GitHub Repository</a>
            </div>

            <div class="card">
                <h2>Retendo</h2>
                <p class="status status-soon">Coming Soon</p>
                <p>Multi-platform Nintendo Network revival project.</p>
                <a href="#" class="btn btn-disabled">Coming Soon</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 ReviveShop Project</p>
        </div>
    </footer>
</body>
</html>
